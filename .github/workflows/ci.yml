name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Windows Rust checks
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw Cargo.toml
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (-not $match.Success) {
            throw 'Could not read the package version from Cargo.toml.'
          }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Check whether this version is already released
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('create', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('create', 'true');
            }

      - name: Package Windows binary
        if: steps.release.outputs.create == 'true'
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath target\release\wxdb.exe -DestinationPath "wxdb-v${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Create GitHub Release
        if: steps.release.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: wxdb-v${{ steps.version.outputs.version }}-windows-x64.zip
